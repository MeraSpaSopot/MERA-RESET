name: Build MERA RESET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          mkdir buildsrc
          unzip -q "MERA_RESET_ANDROID_PROJECT (1).zip" -d buildsrc

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        working-directory: buildsrc/MERA_RESET_ANDROID
        run: gradle assembleDebug

      - name: Nazwij APK
        run: |
          cp buildsrc/MERA_RESET_ANDROID/app/build/outputs/apk/debug/app-debug.apk MERA_RESET.apk

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: MERA_RESET_APK
          path: MERA_RESET.apk
